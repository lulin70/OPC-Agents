# 默认 server 配置（硬约束 H7 强制）
# 部署路径：/etc/nginx/sites-available/default.conf
# 关联文档：docs/architecture/DEPLOYMENT_ARCHITECTURE.md §3.1.3
#
# 硬约束 H7：nginx 默认 server 块（捕获直接 IP 访问和未匹配 Host）必须服务官网
# 静态文件，禁止代理到任何应用容器。任何变更必须经 7-Role 共识评审。
#
# 该配置保证：
#   - 直接访问 http://47.116.219.15 显示官网首页，不暴露任何应用容器
#   - 未匹配的 Host 头（含恶意扫描）回落到官网静态文件
#   - 即使攻击者通过 IP 直连也无法触达 promiselink-pro:8001

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/promiselink.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promiselink.cn/privkey.pem;

    root /var/www/html;
    index index.html;

    # 严格仅服务静态文件——禁止任何 proxy_pass
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 限流
    limit_req zone=website_zone burst=20 nodelay;

    # 自定义错误页
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /var/www/html;
    }
}
