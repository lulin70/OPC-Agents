# 官网 nginx 配置（promiselink.cn）
# 部署路径：/etc/nginx/sites-available/promiselink.cn.conf
# 关联文档：docs/architecture/DEPLOYMENT_ARCHITECTURE.md §3.1.1
# 作用：服务官网静态文件，提供产品介绍、下载、快速入门、反馈入口

# HTTP 80 -> HTTPS 301 跳转
server {
    listen 80;
    listen [::]:80;
    server_name promiselink.cn;

    # ACME challenge 留道（Certbot 续签时使用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主 server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name promiselink.cn;

    ssl_certificate     /etc/letsencrypt/live/promiselink.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promiselink.cn/privkey.pem;

    root /var/www/html;
    index index.html;

    # ---------- 路由 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # 一键安装脚本别名（DEPLOYMENT_ARCHITECTURE.md §4.1.2）
    location = /install.sh {
        alias /var/www/scripts/install.sh;
        default_type application/x-sh;
        add_header Content-Disposition 'attachment; filename="install.sh"';
    }

    # 静态资源缓存
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML 不缓存（保证内容更新即时生效）
    location ~* \.html?$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # ---------- 安全头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 限流（DEPLOYMENT_ARCHITECTURE.md §3.1.1） ----------
    limit_req zone=website_zone burst=20 nodelay;

    # 自定义错误页
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /var/www/html;
    }
}
