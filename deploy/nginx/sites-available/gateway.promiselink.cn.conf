# 网关反向代理配置（gateway.promiselink.cn -> promiselink-pro:8001）
# 部署路径：/etc/nginx/sites-available/gateway.promiselink.cn.conf
# 关联文档：docs/architecture/DEPLOYMENT_ARCHITECTURE.md §3.1.2
# 作用：专业版网关反向代理，支持 HTTPS API 与 WSS 长连接
# 硬约束 H5：备案前临时使用 47.116.219.15:8001，备案后切换到 gateway.promiselink.cn

# HTTP 80 -> HTTPS 301 跳转
server {
    listen 80;
    listen [::]:80;
    server_name gateway.promiselink.cn;

    # ACME challenge 留道
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主 server（反向代理到 promiselink-pro:8001）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.promiselink.cn;

    ssl_certificate     /etc/letsencrypt/live/gateway.promiselink.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.promiselink.cn/privkey.pem;

    # ---------- 健康检查（不进入网关容器，nginx 直接返回） ----------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- 网关反向代理 ----------
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # 透传真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WSS 升级支持（DEPLOYMENT_ARCHITECTURE.md §4.4.1）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长连接超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # 缓冲设置（流式响应关闭缓冲）
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------- 安全头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # ---------- 限流（DEPLOYMENT_ARCHITECTURE.md §3.1.2） ----------
    limit_req zone=gateway_zone burst=50 nodelay;
}
