# OPC-Agents 云端 nginx 主配置（47.116.219.15）
# 部署路径：/etc/nginx/nginx.conf
# 关联文档：docs/architecture/DEPLOYMENT_ARCHITECTURE.md §3.1
# 硬约束 H7：默认 server 块仅服务官网静态文件，禁止代理到任何应用容器

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ---------- 基础配置 ----------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 12m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------- 日志格式 ----------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ---------- 限流区域（DEPLOYMENT_ARCHITECTURE.md §3.1.4） ----------
    # 官网：单 IP 100 req/min
    limit_req_zone $binary_remote_addr zone=website_zone:10m rate=100r/m;
    # 网关：单 IP 300 req/min
    limit_req_zone $binary_remote_addr zone=gateway_zone:10m rate=300r/m;
    limit_req_status 429;

    # ---------- WSS 升级映射 ----------
    # 根据 $http_upgrade 设置 Connection 头，正确处理 HTTP / WSS 混合流量
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------- SSL 优化 ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 223.5.5.5 223.6.6.6 valid=300s;
    resolver_timeout 5s;

    # ---------- 安全响应头（全局） ----------
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------- 站点配置加载 ----------
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
