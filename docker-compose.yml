version: '3.8'

services:
  opc-agents:
    build: .
    container_name: opc-agents
    ports:
      - "8501:8501"
    volumes:
      # Persist data across container restarts
      - opc-data:/app/data
    env_file:
      - .env
    environment:
      - OPC_LOCALE=${OPC_LOCALE:-zh_CN}
      - MOKA_API_KEY=${MOKA_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - opc-network

volumes:
  opc-data:
    driver: local

networks:
  opc-network:
    driver: bridge
