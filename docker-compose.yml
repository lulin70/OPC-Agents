services:
  opc-agents:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./deliverables:/app/deliverables
      - ./plugins:/app/plugins
    env_file:
      - .env
    environment:
      - OPC_WORKSPACE=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  skill-marketplace:
    build: .
    command: ["uvicorn", "opc_manager.skill_marketplace_api:app", "--host", "0.0.0.0", "--port", "8900"]
    ports:
      - "8900:8900"
    volumes:
      - ./data:/app/data
      - ./plugins:/app/plugins
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8900/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-sse:
    build: .
    command: ["uvicorn", "opc_manager.mcp_transport:create_sse_app", "--host", "0.0.0.0", "--port", "8901"]
    ports:
      - "8901:8901"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8901/health"]
      interval: 30s
      timeout: 10s
      retries: 3
