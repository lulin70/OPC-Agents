version: '3.8'

services:
  opc-agents:
    build: .
    container_name: opc-agents
    ports:
      - "8501:8501"
    volumes:
      # Persist data across container restarts
      - opc-data:/app/data
      # Config file (auto-created from .env.example if not exists)
      - ./.env:/app/.env
    environment:
      - OPC_LOCALE=${OPC_LOCALE:-zh_CN}
      - MOKA_API_KEY=${MOKA_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - opc-network

volumes:
  opc-data:
    driver: local

networks:
  opc-network:
    driver: bridge
