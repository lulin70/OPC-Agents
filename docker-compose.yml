version: '3.8'

services:
  opc-agents:
    build: .
    container_name: opc-agents
    ports:
      - "8501:8501"
    volumes:
      # Persist data across container restarts
      - opc-data:/app/data
      # Config file (create from example if not exists)
      - ./.env:/app/.env
    environment:
      - OPC_LOCALE=zh_CN
      - OPC_ENCRYPTION_KEY=${OPC_ENCRYPTION_KEY:-auto-generate}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - opc-network

volumes:
  opc-data:
    driver: local

networks:
  opc-network:
    driver: bridge
