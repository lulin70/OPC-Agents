name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Install Playwright browsers
      run: |
        playwright install chromium --with-deps

    - name: Lint with ruff (blocking — unified with pre-commit)
      # D03 P0-1: Unified ruff version to 0.15.21 (was 0.6.9, caused CI failures due to E402 drift)
      run: |
        pip install ruff==0.15.21
        ruff check opc_manager/ frontend/ tests/ --exit-non-zero-on-fix

    - name: Extended lint report (non-blocking — style info)
      run: |
        ruff check opc_manager/ frontend/ tests/ --select=E501 --statistics --exit-zero || true

    - name: Type check with mypy (blocking — TD-065 resolved)
      # TD-065: 516 errors → 0 errors in v0.3.3 (2026-06-28)
      # Hard constraint: "CI mypy检查必须为阻塞状态"
      # v0.3.32: Pin mypy==1.11.2 to align with .pre-commit-config.yaml (D06 T3)
      run: |
        pip install mypy==1.11.2
        mypy opc_manager/ --ignore-missing-imports --follow-imports=silent

    - name: Check formatting with Black
      # v0.3.32: Pin black==24.8.0 to align with .pre-commit-config.yaml (D06 T3)
      run: |
        pip install black==24.8.0
        black --check --target-version py310 opc_manager/ frontend/ tests/

    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r opc_manager/ -ll -ii

    - name: Run tests
      # P2-13: tests/ 分层为 unit/integration/e2e，路径已更新
      # P1-7: 6 个 --deselect 已移除（_read_key_from_env_local 路径修复 + _ensure_encryption_key 移除 _save_to_disk）
      run: |
        set -o pipefail && PYTHONPATH=. pytest --tb=long -v --junitxml=test-results.xml --ignore=tests/e2e \
          2>&1 | tee test-output.txt

    - name: Run E2E tests (Playwright UI)
      # E2E 测试单独运行：Playwright sync_playwright 会创建独立事件循环线程，
      # 与后续单元测试中的 asyncio.run() 冲突（Python 3.12 检测到运行中循环会抛 RuntimeError）。
      # 分离运行避免事件循环污染。
      # E2E 为强制门：失败必须阻塞合并（ASSESSMENT_D01 P0-4 修复，原 || true 吞掉失败）。
      run: |
        PYTHONPATH=. pytest tests/e2e/ --tb=short -v --timeout=120 2>&1 | tee e2e-output.txt

    - name: Coverage report
      if: matrix.python-version == '3.11'
      run: |
        PYTHONPATH=. pytest --cov=opc_manager --cov=frontend \
          --cov-report=xml:coverage.xml --cov-report=term \
          --cov-fail-under=70 \
          --tb=no -q --timeout=30 \
          --ignore=tests/e2e \
          -p no:cacheprovider

    - name: Upload coverage artifact
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 14

    - name: Cyclomatic complexity gate (radon cc, D+ blocking)
      # P3-2: D/E/F grade functions (complexity >= 21) are now blocking.
      # All 6 former D/E functions have been refactored to C or below.
      # C grade (11-20) is reported but non-blocking; D+ (21+) fails CI.
      if: matrix.python-version == '3.11'
      run: |
        pip install radon
        echo "===== CYCLOMATIC COMPLEXITY GATE (D+ = blocking) ====="
        radon cc opc_manager/ -s -n D > /tmp/radon_d.txt 2>&1
        if [ -s /tmp/radon_d.txt ]; then
          echo "FAIL: D+ grade functions detected (complexity >= 21):"
          cat /tmp/radon_d.txt
          exit 1
        fi
        echo "PASS: No D+ grade functions"
        echo ""
        echo "===== COMPLEXITY SUMMARY (C+ grade, informational) ====="
        radon cc opc_manager/ -s -n C -j -O /tmp/radon_cc.json || true
        python3 -c "
        import json
        try:
            data = json.load(open('/tmp/radon_cc.json'))
            total = sum(len(v) for v in data.values())
            grades = {}
            for file_funcs in data.values():
                for func in file_funcs:
                    g = func.get('grade', '?')
                    grades[g] = grades.get(g, 0) + 1
            print(f'Total C+ blocks: {total}')
            for g in sorted(grades):
                print(f'  {g}: {grades[g]} blocks')
        except Exception as e:
            print(f'radon summary parse error: {e}')
        " || true

    - name: Verify Docker build
      run: docker build -t opc-agents-test .
      if: matrix.python-version == '3.11'

    - name: Dependency vulnerability scan
      run: |
        pip install pip-audit
        pip-audit --desc
      if: matrix.python-version == '3.11'

    - name: Display test failures
      if: always()
      run: |
        echo "===== TEST FAILURE SUMMARY ====="
        if [ -f test-results.xml ]; then
          python3 -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('test-results.xml')
        root = tree.getroot()
        for tc in root.iter('testcase'):
            for child in tc:
                if child.tag in ('failure', 'error'):
                    print(f'FAILED: {tc.get(\"classname\")}.{tc.get(\"name\")}')
                    text = child.text or ''
                    print(text[:500])
                    print('---')
          " || true
        fi
        echo "===== LAST 50 LINES OF OUTPUT ====="
        tail -50 test-output.txt || true

    - name: Verify version consistency
      run: |
        VERSION_FILE=$(cat VERSION)
        VERSION_PY=$(python -c "from opc_manager.version import __version__; print(__version__)")
        if [ "$VERSION_FILE" != "$VERSION_PY" ]; then
          echo "Version mismatch: VERSION=$VERSION_FILE, version.py=$VERSION_PY"
          exit 1
        fi
        # D02 P0-4: 扩展校验范围 — mcp_protocol.py MCP_SERVER_VERSION
        MCP_VERSION=$(python -c "from opc_manager.mcp_protocol import MCP_SERVER_VERSION; print(MCP_SERVER_VERSION)")
        if [ "$VERSION_FILE" != "$MCP_VERSION" ]; then
          echo "Version mismatch: VERSION=$VERSION_FILE, mcp_protocol.py MCP_SERVER_VERSION=$MCP_VERSION"
          exit 1
        fi
        echo "✓ 版本一致性校验通过（VERSION / version.py / mcp_protocol.py = $VERSION_FILE）"

    - name: Verify README consistency (三语版本号/模块数/测试数对齐)
      run: |
        python - <<'PYEOF'
        import re, sys, subprocess
        VERSION = open("VERSION").read().strip()
        EXPECTED_MODULE_COUNT = 99
        # P2-2: 动态计算测试数量，替代硬编码4193
        result = subprocess.run(
            ["python", "-m", "pytest", "--co", "-q", "--no-header"],
            capture_output=True, text=True, cwd="."
        )
        # pytest --co -q 最后一行格式："4193 tests collected in 1.23s"
        last_line = result.stdout.strip().split("\n")[-1] if result.stdout.strip() else ""
        match = re.search(r"(\d+) tests collected", last_line)
        if not match:
            print(f"无法从 pytest --co 输出中解析测试数量: {last_line}")
            print(f"pytest stdout (last 500): {result.stdout[-500:]}")
            print(f"pytest stderr (last 500): {result.stderr[-500:]}")
            sys.exit(1)
        ACTUAL_TEST_COUNT = int(match.group(1))
        readmes = ["README.md", "README-EN.md", "README-JP.md"]
        errors = []
        for path in readmes:
            text = open(path, encoding="utf-8").read()
            # 版本号必须出现且与 VERSION 文件一致
            if VERSION not in text:
                errors.append(f"{path}: 版本号 {VERSION} 未找到")
            # pip install 命令中的版本号
            pip_pattern = rf"opc-agents=={re.escape(VERSION)}"
            if not re.search(pip_pattern, text):
                errors.append(f"{path}: pip install opc-agents=={VERSION} 未找到")
            # 模块数对齐
            if f"{EXPECTED_MODULE_COUNT}" not in text:
                errors.append(f"{path}: 模块数 {EXPECTED_MODULE_COUNT} 未找到")
            # 测试数对齐（动态值，替代原硬编码4193）
            if f"{ACTUAL_TEST_COUNT}" not in text:
                errors.append(f"{path}: 测试数 {ACTUAL_TEST_COUNT} 未找到（请同步更新README）")
        if errors:
            print("README 一致性校验失败：")
            for e in errors:
                print(f"  - {e}")
            sys.exit(1)
        print(f"✓ 三语 README 一致性校验通过（版本 {VERSION}, 模块 {EXPECTED_MODULE_COUNT}, 测试 {ACTUAL_TEST_COUNT}）")
        PYEOF
