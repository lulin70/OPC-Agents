name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install Playwright browsers
      run: |
        playwright install chromium --with-deps

    - name: Lint with flake8 (blocking — critical errors only)
      run: |
        flake8 opc_manager/ frontend/ tests/ --count --select=E9,F63,F7,F82,W605 --show-source --statistics

    - name: Extended lint report (non-blocking — dead code & style)
      run: |
        flake8 opc_manager/ frontend/ tests/ --count --select=F401,F841,E501,E722 --show-source --statistics --exit-zero || true

    - name: Type check with mypy (blocking — TD-065 resolved)
      # TD-065: 516 errors → 0 errors in v0.3.3 (2026-06-28)
      # Hard constraint: "CI mypy检查必须为阻塞状态"
      run: |
        pip install mypy
        mypy opc_manager/ --ignore-missing-imports --follow-imports=silent

    - name: Check formatting with Black
      run: |
        black --check --target-version py310 opc_manager/ frontend/ tests/

    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r opc_manager/ -ll -ii

    - name: Run tests
      # TODO: remove --deselect for test_settings.py once CI-only persistence bug is fixed.
      # These 6 tests pass locally but fail in CI (provider resets to default 'moka'
      # after singleton recreation — likely relative path / cwd issue in CI container).
      # Tracked as P1 — see docs/PROJECT_STATUS.md.
      run: |
        set -o pipefail && PYTHONPATH=. pytest --tb=long -v --junitxml=test-results.xml --ignore=tests/e2e \
          --deselect tests/test_settings.py::TestLLMCRUD::test_llm_persistence_to_disk \
          --deselect tests/test_settings.py::TestSMTPCRUD::test_smtp_persistence \
          --deselect tests/test_settings.py::TestAutoGenerateKey::test_key_persisted_across_restarts \
          --deselect tests/test_settings.py::TestEncryptedStorage::test_api_key_decrypted_on_load \
          --deselect tests/test_settings.py::TestEncryptedStorage::test_smtp_password_decrypted_on_load \
          --deselect tests/test_settings.py::TestEncryptedStorage::test_auto_migration_plaintext_to_encrypted \
          2>&1 | tee test-output.txt

    - name: Run E2E tests (Playwright UI)
      # E2E 测试单独运行：Playwright sync_playwright 会创建独立事件循环线程，
      # 与后续单元测试中的 asyncio.run() 冲突（Python 3.12 检测到运行中循环会抛 RuntimeError）。
      # 分离运行避免事件循环污染。continue-on-error: UI 测试失败不阻塞合并（后续修复）。
      continue-on-error: true
      run: |
        PYTHONPATH=. pytest tests/e2e/ --tb=short -v --timeout=120 2>&1 | tee e2e-output.txt || true

    - name: Coverage report
      if: matrix.python-version == '3.11'
      run: |
        PYTHONPATH=. pytest --cov=opc_manager --cov=frontend \
          --cov-report=xml:coverage.xml --cov-report=term \
          --cov-fail-under=62 \
          --tb=no -q --timeout=10 \
          --ignore=tests/e2e \
          --ignore=tests/test_e2e_real.py \
          --ignore=tests/test_e2e_user_journeys.py \
          --ignore=tests/test_e2e_user_workflow.py \
          --ignore=tests/test_integration_e2e.py \
          -p no:cacheprovider

    - name: Upload coverage artifact
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 14

    - name: Verify Docker build
      run: docker build -t opc-agents-test .
      if: matrix.python-version == '3.11'

    - name: Dependency vulnerability scan
      run: |
        pip install pip-audit
        pip-audit --desc
      if: matrix.python-version == '3.11'

    - name: Display test failures
      if: always()
      run: |
        echo "===== TEST FAILURE SUMMARY ====="
        if [ -f test-results.xml ]; then
          python3 -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('test-results.xml')
        root = tree.getroot()
        for tc in root.iter('testcase'):
            for child in tc:
                if child.tag in ('failure', 'error'):
                    print(f'FAILED: {tc.get(\"classname\")}.{tc.get(\"name\")}')
                    text = child.text or ''
                    print(text[:500])
                    print('---')
          " || true
        fi
        echo "===== LAST 50 LINES OF OUTPUT ====="
        tail -50 test-output.txt || true

    - name: Verify version consistency
      run: |
        VERSION_FILE=$(cat VERSION)
        VERSION_PY=$(python -c "from opc_manager.version import __version__; print(__version__)")
        if [ "$VERSION_FILE" != "$VERSION_PY" ]; then
          echo "Version mismatch: VERSION=$VERSION_FILE, version.py=$VERSION_PY"
          exit 1
        fi

    - name: Verify README consistency (三语版本号/模块数/测试数对齐)
      run: |
        python - <<'PYEOF'
        import re, sys
        VERSION = open("VERSION").read().strip()
        EXPECTED_MODULE_COUNT = 99
        EXPECTED_TEST_COUNT = 3305
        readmes = ["README.md", "README-EN.md", "README-JP.md"]
        errors = []
        for path in readmes:
            text = open(path, encoding="utf-8").read()
            # 版本号必须出现且与 VERSION 文件一致
            if VERSION not in text:
                errors.append(f"{path}: 版本号 {VERSION} 未找到")
            # pip install 命令中的版本号
            pip_pattern = rf"opc-agents=={re.escape(VERSION)}"
            if not re.search(pip_pattern, text):
                errors.append(f"{path}: pip install opc-agents=={VERSION} 未找到")
            # 模块数对齐
            if f"{EXPECTED_MODULE_COUNT}" not in text:
                errors.append(f"{path}: 模块数 {EXPECTED_MODULE_COUNT} 未找到")
            # 测试数对齐
            if f"{EXPECTED_TEST_COUNT}" not in text:
                errors.append(f"{path}: 测试数 {EXPECTED_TEST_COUNT} 未找到")
        if errors:
            print("README 一致性校验失败：")
            for e in errors:
                print(f"  - {e}")
            sys.exit(1)
        print(f"✓ 三语 README 一致性校验通过（版本 {VERSION}, 模块 {EXPECTED_MODULE_COUNT}, 测试 {EXPECTED_TEST_COUNT}）")
        PYEOF
