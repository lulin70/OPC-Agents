name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        flake8 opc_manager/ frontend/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check formatting with Black
      run: |
        pip install "black>=25.0,<26.0"
        black --check opc_manager/ frontend/ tests/

    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r opc_manager/ -ll -ii

    - name: Run tests
      run: |
        PYTHONPATH=. pytest --tb=short -q --junitxml=test-results.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml

    - name: Verify version consistency
      run: |
        VERSION_FILE=$(cat VERSION)
        VERSION_PY=$(python -c "from opc_manager.version import __version__; print(__version__)")
        if [ "$VERSION_FILE" != "$VERSION_PY" ]; then
          echo "Version mismatch: VERSION=$VERSION_FILE, version.py=$VERSION_PY"
          exit 1
        fi
