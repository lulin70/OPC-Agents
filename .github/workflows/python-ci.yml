name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8

    - name: Check code formatting with Black
      run: |
        black --check opc_manager/ opc_hr/ opc_finance/ monitoring/ message_queue/ data_storage/ task_deliverables/ web_interface/

    - name: Lint with Flake8
      run: |
        flake8 opc_manager/ opc_hr/ opc_finance/ monitoring/ message_queue/ data_storage/ task_deliverables/ web_interface/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 opc_manager/ opc_hr/ opc_finance/ monitoring/ message_queue/ data_storage/ task_deliverables/ web_interface/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Run tests with coverage
      run: |
        pytest --cov=opc_manager --cov=opc_hr --cov=opc_finance --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
