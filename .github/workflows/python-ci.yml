name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        flake8 opc_manager/ frontend/ tests/ --count --select=E9,F63,F7,F82,W605 --show-source --statistics

    - name: Check formatting with Black
      run: |
        black --check --target-version py310 opc_manager/ frontend/ tests/

    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r opc_manager/ -ll -ii

    - name: Run tests
      run: |
        set -o pipefail && PYTHONPATH=. pytest --tb=long -v --junitxml=test-results.xml 2>&1 | tee test-output.txt

    - name: Coverage report
      if: matrix.python-version == '3.11'
      run: |
        PYTHONPATH=. pytest --cov=opc_manager --cov=frontend \
          --cov-report=xml:coverage.xml --cov-report=term \
          --cov-fail-under=62 \
          --tb=no -q --timeout=10 \
          --ignore=tests/test_e2e_real.py \
          --ignore=tests/test_e2e_user_journeys.py \
          --ignore=tests/test_e2e_user_workflow.py \
          --ignore=tests/test_integration_e2e.py \
          --ignore=tests/test_wechat_e2e.py \
          -p no:cacheprovider

    - name: Upload coverage artifact
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 14

    - name: Verify Docker build
      run: docker build -t opc-agents-test .
      if: matrix.python-version == '3.11'

    - name: Dependency vulnerability scan
      run: |
        pip install pip-audit
        pip-audit --desc
      if: matrix.python-version == '3.11'

    - name: Display test failures
      if: always()
      run: |
        echo "===== TEST FAILURE SUMMARY ====="
        if [ -f test-results.xml ]; then
          python3 -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('test-results.xml')
        root = tree.getroot()
        for tc in root.iter('testcase'):
            for child in tc:
                if child.tag in ('failure', 'error'):
                    print(f'FAILED: {tc.get(\"classname\")}.{tc.get(\"name\")}')
                    text = child.text or ''
                    print(text[:500])
                    print('---')
          " || true
        fi
        echo "===== LAST 50 LINES OF OUTPUT ====="
        tail -50 test-output.txt || true

    - name: Verify version consistency
      run: |
        VERSION_FILE=$(cat VERSION)
        VERSION_PY=$(python -c "from opc_manager.version import __version__; print(__version__)")
        if [ "$VERSION_FILE" != "$VERSION_PY" ]; then
          echo "Version mismatch: VERSION=$VERSION_FILE, version.py=$VERSION_PY"
          exit 1
        fi
