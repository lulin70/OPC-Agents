name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v3-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-v3-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Check code formatting with Black
      run: |
        pip install "black>=25.0,<26.0"
        black --check opc_manager/ frontend/ tests/

    - name: Lint with Flake8
      run: |
        flake8 opc_manager/ frontend/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 opc_manager/ frontend/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r opc_manager/ -ll -ii

    - name: Security audit
      run: |
        pip install pip-audit
        pip-audit --desc --ignore-vuln PYSEC-2023-228
      continue-on-error: true

    - name: Run tests with coverage
      run: |
        echo "=== Diagnostics ==="
        python -c "import defusedxml; print('defusedxml OK')"
        python -c "import cryptography; print('cryptography OK')"
        ls -la data/.gitkeep || echo "WARNING: data/.gitkeep missing"
        echo "=== Running tests ==="
        PYTHONPATH=. pytest --cov=opc_manager --cov-report=xml --cov-report=term-missing --tb=short -x 2>&1 | tee test_output.txt
      continue-on-error: true

    - name: Show test failures
      if: always()
      run: |
        if [ -f test_output.txt ]; then
          grep -A 20 "FAILED\|ERROR\|failed" test_output.txt || echo "No failures found in output"
        fi

    - name: Verify version consistency
      run: |
        VERSION_FILE=$(cat VERSION)
        VERSION_PY=$(python -c "from opc_manager.version import __version__; print(__version__)")
        if [ "$VERSION_FILE" != "$VERSION_PY" ]; then
          echo "Version mismatch: VERSION=$VERSION_FILE, version.py=$VERSION_PY"
          exit 1
        fi

    - name: Check test results
      run: |
        if [ -f test_output.txt ]; then
          if grep -q "FAILED\|failed.*passed" test_output.txt; then
            echo "Tests failed! See output above."
            exit 1
          fi
        else
          echo "No test output file found"
          exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
