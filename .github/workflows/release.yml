name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run tests
      run: |
        # P0-1 修复：与 python-ci.yml 保持一致——隔离 tests/e2e/ 避免 Playwright
        # sync_playwright 创建的独立事件循环线程污染后续单元测试的 asyncio.run()。
        # v0.3.30: 移除 6 个 stale deselect（provider 单例重置问题已修复，本地验证 6/6 PASS）
        PYTHONPATH=. pytest tests/ -q --tb=short --no-cov \
          --ignore=tests/e2e

    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r opc_manager/ -ll -ii

    - name: Dependency audit with pip-audit
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt

    - name: Coverage gate
      run: |
        # v0.3.30: 阈值 59%→70%（与 python-ci.yml 一致），移除 6 个 stale deselect
        PYTHONPATH=. pytest tests/ -q --tb=short \
          --cov=opc_manager --cov=frontend \
          --cov-fail-under=70 \
          --ignore=tests/e2e

  build-and-push-ghcr:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Lowercase repository name for Docker tag
      id: repo
      run: echo "REPO_LC=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ steps.repo.outputs.REPO_LC }}:${{ steps.version.outputs.VERSION }}
          ghcr.io/${{ steps.repo.outputs.REPO_LC }}:latest
        build-args: |
          VERSION=${{ steps.version.outputs.VERSION }}

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build sdist and wheel
      run: python -m build

    - name: Verify built package version matches tag
      run: |
        BUILT_VERSION=$(python -c "import tarfile, glob; \
          f=glob.glob('dist/*.tar.gz')[0]; \
          t=tarfile.open(f); \
          m=[n for n in t.getnames() if 'PKG-INFO' in n][0]; \
          import io; \
          content=t.extractfile(m).read().decode(); \
          print([l.split(':')[1].strip() for l in content.splitlines() if l.startswith('Version:')][0])")
        echo "Built version: $BUILT_VERSION"
        echo "Tag version: ${{ steps.version.outputs.VERSION }}"
        if [ "$BUILT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
          echo "ERROR: Built package version ($BUILT_VERSION) does not match git tag (${{ steps.version.outputs.VERSION }})"
          exit 1
        fi

    - name: Check if version already exists on PyPI
      id: check_version
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/opc-agents/${VERSION}/json)
        if [ "$STATUS" = "200" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Version $VERSION already exists on PyPI, will skip upload"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Version $VERSION not found on PyPI, will upload"
        fi

    - name: Publish to PyPI
      if: steps.check_version.outputs.exists == 'false'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*

    - name: Verify PyPI publish
      if: steps.check_version.outputs.exists == 'false'
      run: |
        sleep 15
        pip install --dry-run opc-agents==${{ steps.version.outputs.VERSION }} || \
          (echo "WARNING: Package not yet visible on PyPI (propagation delay). Check https://pypi.org/project/opc-agents/#history")

  create-release:
    needs: [test, build-and-push-ghcr, publish-pypi]
    if: always() && needs.test.result == 'success' && needs.build-and-push-ghcr.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Lowercase repository name for Docker tag
      id: repo
      run: echo "REPO_LC=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get changes since last tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
        else
          CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
        fi
        echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: OPC-Agents v${{ steps.version.outputs.VERSION }}
        body: |
          ## Changes in v${{ steps.version.outputs.VERSION }}

          ${{ steps.changelog.outputs.CHANGES }}

          ### PyPI
          ```bash
          pip install opc-agents==${{ steps.version.outputs.VERSION }}
          opc-agents
          ```

          ### Docker (GHCR)
          ```bash
          docker pull ghcr.io/${{ steps.repo.outputs.REPO_LC }}:${{ steps.version.outputs.VERSION }}
          ```

          ### Quick Start (from source)
          ```bash
          pip install -r requirements.txt
          python -m opc_manager
          ```
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
