name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        # P2 修复：排除需要 API Key 的 E2E 测试，避免无 secrets 时失败
        python -m pytest tests/ -q --tb=short --no-cov \
          --ignore=tests/test_e2e_real.py \
          --ignore=tests/test_e2e_user_journeys.py \
          --ignore=tests/test_e2e_user_workflow.py \
          --ignore=tests/test_integration_e2e.py \
          --ignore=tests/test_ui_e2e_apptest.py

    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r opc_manager/ -ll -ii

    - name: Dependency audit with pip-audit
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt

    - name: Coverage gate
      run: |
        python -m pytest tests/ -q --tb=short \
          --cov=opc_manager --cov=frontend \
          --cov-fail-under=62 \
          --ignore=tests/test_e2e_real.py \
          --ignore=tests/test_e2e_user_journeys.py \
          --ignore=tests/test_e2e_user_workflow.py \
          --ignore=tests/test_integration_e2e.py \
          --ignore=tests/test_ui_e2e_apptest.py

  build-and-push-ghcr:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          ghcr.io/${{ github.repository }}:latest
        build-args: |
          VERSION=${{ steps.version.outputs.VERSION }}

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build sdist and wheel
      run: python -m build

    - name: Verify built package version matches tag
      run: |
        BUILT_VERSION=$(python -c "import tarfile, glob; \
          f=glob.glob('dist/*.tar.gz')[0]; \
          t=tarfile.open(f); \
          m=[n for n in t.getnames() if 'PKG-INFO' in n][0]; \
          import io; \
          content=t.extractfile(m).read().decode(); \
          print([l.split(':')[1].strip() for l in content.splitlines() if l.startswith('Version:')][0])")
        echo "Built version: $BUILT_VERSION"
        echo "Tag version: ${{ steps.version.outputs.VERSION }}"
        if [ "$BUILT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
          echo "ERROR: Built package version ($BUILT_VERSION) does not match git tag (${{ steps.version.outputs.VERSION }})"
          exit 1
        fi

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*

    - name: Verify PyPI publish
      run: |
        sleep 15
        pip install --dry-run opc-agents==${{ steps.version.outputs.VERSION }} || \
          (echo "WARNING: Package not yet visible on PyPI (propagation delay). Check https://pypi.org/project/opc-agents/#history")

  create-release:
    needs: [test, build-and-push-ghcr, publish-pypi]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get changes since last tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
        else
          CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
        fi
        echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: OPC-Agents v${{ steps.version.outputs.VERSION }}
        body: |
          ## Changes in v${{ steps.version.outputs.VERSION }}

          ${{ steps.changelog.outputs.CHANGES }}

          ### PyPI
          ```bash
          pip install opc-agents==${{ steps.version.outputs.VERSION }}
          opc-agents
          ```

          ### Docker (GHCR)
          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          ```

          ### Quick Start (from source)
          ```bash
          pip install -r requirements.txt
          python -m opc_manager
          ```
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
