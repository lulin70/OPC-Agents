name: Weekly Real E2E Tests

on:
  schedule:
    # Every Monday at 3:00 AM UTC (11:00 AM Beijing time)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run core skill E2E tests
      env:
        SKIP_E2E: "0"
        MOKA_API_KEY: ${{ secrets.MOKA_API_KEY }}
        MOKA_API_BASE: ${{ secrets.MOKA_API_BASE }}
        MOKA_MODEL: ${{ secrets.MOKA_MODEL }}
      run: |
        PYTHONPATH=. pytest tests/test_e2e_real.py -m e2e_core_skill -v --tb=long 2>&1 | tee e2e-output.txt

    - name: Run integration E2E tests
      run: |
        PYTHONPATH=. pytest tests/test_integration_e2e.py -v --tb=long 2>&1 | tee -a e2e-output.txt

    - name: Upload E2E report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-report-${{ github.run_id }}
        path: e2e-output.txt
        retention-days: 30

    - name: E2E Test Report
      if: always()
      run: |
        echo "===== E2E TEST SUMMARY ====="
        if [ -f e2e-output.txt ]; then
          tail -30 e2e-output.txt
        fi
        echo "===== END ====="

    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          // P2 修复：E2E 失败时自动创建 GitHub Issue 通知，替代原 echo "::warning::"
          const date = new Date().toISOString().split('T')[0];
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `🚨 Weekly E2E 测试失败 ${date}`,
            body: [
              `## E2E 测试失败通知`,
              ``,
              `**失败时间**: ${date}`,
              `**运行链接**: ${runUrl}`,
              `**测试范围**: tests/test_e2e_real.py -m e2e_core_skill`,
              ``,
              `### 可能影响`,
              `核心技能（email/finance/report）可能存在问题，需要人工排查。`,
              ``,
              `### 下一步`,
              `1. 查看 E2E 报告 artifact`,
              `2. 在本地复现：\`SKIP_E2E=0 pytest tests/test_e2e_real.py -m e2e_core_skill -v\``,
              `3. 修复后关闭此 Issue`,
            ].join('\n'),
            labels: ['bug', 'e2e', 'auto-generated']
          });
