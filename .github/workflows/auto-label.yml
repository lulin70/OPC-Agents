name: Auto Label PR

# P2 安全修复：pull_request_target → pull_request
# 原实现使用 pull_request_target 触发器，该触发器使用 base 分支的 workflow 文件
# 但拥有 secrets 访问权限，若未来添加 secrets 使用可能被恶意 PR 利用。
# 本 workflow 不使用 secrets，改为 pull_request 更安全。
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v9  # v9 supports Node 24 (Node 20 deprecated 2026-06-16, removed fall 2026)
      with:
        script: |
          const pr = context.payload.pull_request;
          const title = pr.title.toLowerCase();
          
          const labels = new Set();
          
          // Add labels based on PR title
          if (title.startsWith('feat')) {
            labels.add('enhancement');
          } else if (title.startsWith('fix')) {
            labels.add('bug');
          } else if (title.startsWith('docs')) {
            labels.add('documentation');
          } else if (title.startsWith('test')) {
            labels.add('testing');
          } else if (title.startsWith('refactor')) {
            labels.add('refactoring');
          } else if (title.startsWith('chore')) {
            labels.add('chore');
          }
          
          // Add labels based on changed files
          const files = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number
          });
          
          for (const file of files.data) {
            if (file.filename.endsWith('.md')) {
              labels.add('documentation');
            } else if (file.filename.endsWith('.py') && file.filename.includes('test')) {
              labels.add('testing');
            } else if (file.filename.endsWith('.yml') || file.filename.endsWith('.yaml')) {
              labels.add('ci/cd');
            } else if (file.filename.endsWith('.toml') || file.filename.endsWith('.txt')) {
              labels.add('dependencies');
            }
          }
          
          if (labels.size > 0) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: Array.from(labels)
            });
          }
