name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          python -m flake8 opc_manager/ --max-line-length=120 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --tb=short -q

      - name: Verify version consistency
        run: |
          VERSION_FILE=$(cat VERSION)
          VERSION_PY=$(python -c "from opc_manager.version import __version__; print(__version__)")
          if [ "$VERSION_FILE" != "$VERSION_PY" ]; then
            echo "Version mismatch: VERSION=$VERSION_FILE, version.py=$VERSION_PY"
            exit 1
          fi
