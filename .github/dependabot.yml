version: 2
updates:
  # pip 生态：生产 + 开发依赖（weekly，分组 + 忽略 dev 依赖 patch/minor）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    reviewers:
      - "lulin70"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # 开发依赖分组：ruff/black/mypy/pytest 等合并为一个 PR
      python-dev-dependencies:
        patterns:
          - "ruff"
          - "black"
          - "mypy"
          - "flake8"
          - "bandit"
          - "pip-audit"
          - "radon"
          - "types-*"
          - "pytest*"
          - "responses"
          - "httpx"
          - "psutil"
          - "playwright"
      # 生产依赖分组：除 dev 依赖外的所有
      python-production-dependencies:
        exclude-patterns:
          - "ruff"
          - "black"
          - "mypy"
          - "flake8"
          - "bandit"
          - "pip-audit"
          - "radon"
          - "types-*"
          - "pytest*"
          - "responses"
          - "httpx"
          - "psutil"
          - "playwright"
    # project_memory 硬约束（2026-07-26 调整）：allow patch/minor updates for dev dependencies
    # 理由：radon 6.0→6.0.1 case proved patch updates useful;
    # keeping deps current avoids security vuln accumulation.
    # major 更新可能引入 breaking change，仍需人工 review（默认行为，无需 ignore）。


  # pip 安全更新：每天检查 GHSA 安全公告（不延迟到 weekly）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    labels:
      - "security"
      - "dependencies"
      - "automated"
    reviewers:
      - "lulin70"

  # Docker 生态：weekly
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions 生态：monthly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
