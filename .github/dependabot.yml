version: 2
updates:
  # pip 生态：生产 + 开发依赖（weekly，分组 + 忽略 dev 依赖 patch/minor）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    reviewers:
      - "lulin70"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # 开发依赖分组：ruff/black/mypy/pytest 等合并为一个 PR
      python-dev-dependencies:
        patterns:
          - "ruff"
          - "black"
          - "mypy"
          - "flake8"
          - "bandit"
          - "pip-audit"
          - "radon"
          - "types-*"
          - "pytest*"
          - "responses"
          - "httpx"
          - "psutil"
          - "playwright"
      # 生产依赖分组：除 dev 依赖外的所有
      python-production-dependencies:
        exclude-patterns:
          - "ruff"
          - "black"
          - "mypy"
          - "flake8"
          - "bandit"
          - "pip-audit"
          - "radon"
          - "types-*"
          - "pytest*"
          - "responses"
          - "httpx"
          - "psutil"
          - "playwright"
    ignore:
      # dev 依赖的 patch/minor 更新忽略（major 仍会通知）
      # 理由：dev 依赖的 patch/minor 更新通常不影响生产行为，
      # 但每次都触发 PR + CI 跑全套测试，噪音大且浪费资源。
      # major 更新可能引入 breaking change，仍需人工 review。
      - dependency-name: "ruff"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "black"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "mypy"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "flake8"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "bandit"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "pip-audit"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "radon"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "types-*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "responses"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "psutil"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]

  # pip 安全更新：每天检查 GHSA 安全公告（不延迟到 weekly）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    labels:
      - "security"
      - "dependencies"
      - "automated"
    reviewers:
      - "lulin70"

  # Docker 生态：weekly
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions 生态：monthly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
