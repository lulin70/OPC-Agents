<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - OPC Agency</title>
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent: #1890ff;
            --success: #52c41a;
            --danger: #ff4d4f;
            --btn-success: #4CAF50;
            --btn-danger: #f44336;
        }
        [data-theme="dark"] {
            --bg-primary: #141414;
            --bg-secondary: #1f1f1f;
            --bg-card: #262626;
            --text-primary: #e6e6e6;
            --text-secondary: #a0a0a0;
            --border-color: #404040;
            --accent: #40a9ff;
            --success: #73d13d;
            --danger: #ff7875;
            --btn-success: #52c41a;
            --btn-danger: #ff7875;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .top-bar h1 { font-size: 18px; font-weight: 600; }
        .back-btn {
            padding: 6px 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .container { max-width: 900px; margin: 24px auto; padding: 0 20px; }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text-secondary); }
        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-success { background: var(--btn-success); color: #fff; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .model-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .model-row:last-child { border-bottom: none; }
        .model-name { font-weight: 500; }
        .model-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .status-ok { background: var(--success); color: #fff; }
        .status-no { background: var(--danger); color: #fff; }
        .info-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
        .info-label { color: var(--text-secondary); }
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px;
            color: #fff; font-size: 14px; z-index: 9999; display: none;
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .theme-toggle {
            padding: 4px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>⚙️ 系统设置</h1>
        <div style="display:flex;gap:10px;align-items:center;">
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            <a href="/" class="back-btn">← 返回首页</a>
        </div>
    </div>
    <div class="container">
        <div class="card">
            <h2>📊 系统信息</h2>
            <div id="system-info"><p style="color:var(--text-secondary)">加载中...</p></div>
        </div>
        <div class="card">
            <h2>🤖 模型配置</h2>
            <div id="models-info"><p style="color:var(--text-secondary)">加载中...</p></div>
        </div>
        <div class="card">
            <h2>🔌 MCP集成</h2>
            <div id="mcp-info"><p style="color:var(--text-secondary)">加载中...</p></div>
            <div class="form-group" style="margin-top:12px;">
                <label class="form-label">GitHub Token</label>
                <input type="password" class="form-input" id="github-token" placeholder="输入新的GitHub Token">
            </div>
            <button class="btn btn-primary btn-sm" onclick="updateMcp()">保存Token</button>
        </div>
        <div class="card">
            <h2>💰 财务预算</h2>
            <div class="form-group">
                <label class="form-label">月度预算</label>
                <input type="number" class="form-input" id="monthly-budget" placeholder="100.0" style="max-width:200px;">
            </div>
            <button class="btn btn-primary btn-sm" onclick="updateBudget()">保存预算</button>
        </div>
        <div class="card">
            <h2>🧪 模型测试</h2>
            <div class="form-group">
                <label class="form-label">选择模型</label>
                <select class="form-input" id="test-model" style="max-width:200px;">
                    <option value="glm">GLM</option>
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="google">Google</option>
                </select>
            </div>
            <button class="btn btn-success btn-sm" onclick="testModel()">测试连接</button>
            <div id="test-result" style="margin-top:8px;font-size:14px;"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        })();
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
        function showToast(msg, type) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast toast-' + type;
            t.style.display = 'block';
            setTimeout(function() { t.style.display = 'none'; }, 3000);
        }
        $(function() {
            $.get('/api/settings/', function(data) {
                var sysHtml = '';
                if (data.system) {
                    var s = data.system;
                    sysHtml += '<div class="info-row"><span class="info-label">系统名称</span><span>' + s.name + '</span></div>';
                    sysHtml += '<div class="info-row"><span class="info-label">版本</span><span>' + s.version + '</span></div>';
                    sysHtml += '<div class="info-row"><span class="info-label">Python</span><span>' + s.python_version + '</span></div>';
                    sysHtml += '<div class="info-row"><span class="info-label">端口</span><span>' + s.web_port + '</span></div>';
                }
                $('#system-info').html(sysHtml);
                var mHtml = '';
                if (data.models) {
                    Object.keys(data.models).forEach(function(name) {
                        var m = data.models[name];
                        var statusClass = m.has_key ? 'status-ok' : 'status-no';
                        var statusText = m.has_key ? '已配置' : '未配置';
                        mHtml += '<div class="model-row"><div><span class="model-name">' + name + '</span> <span class="model-status ' + statusClass + '">' + statusText + '</span></div><span style="font-size:12px;color:var(--text-secondary)">' + (m.model || '-') + '</span></div>';
                    });
                }
                $('#models-info').html(mHtml || '<p style="color:var(--text-secondary)">无模型配置</p>');
                var mcHtml = '';
                if (data.mcp) {
                    mcHtml += '<div class="info-row"><span class="info-label">GitHub Token</span><span>' + (data.mcp.has_github_token ? '已配置' : '未配置') + '</span></div>';
                    mcHtml += '<div class="info-row"><span class="info-label">Agent源</span><span>' + (data.mcp.agent_sources_count || 0) + ' 个</span></div>';
                    mcHtml += '<div class="info-row"><span class="info-label">Skill源</span><span>' + (data.mcp.skill_sources_count || 0) + ' 个</span></div>';
                }
                $('#mcp-info').html(mcHtml);
            });
        });
        function updateMcp() {
            var token = $('#github-token').val().trim();
            if (!token) { showToast('请输入Token', 'error'); return; }
            $.ajax({ url: '/api/settings/mcp', method: 'POST', contentType: 'application/json', data: JSON.stringify({ github_token: token }),
                success: function() { showToast('GitHub Token已更新', 'success'); $('#github-token').val(''); },
                error: function(xhr) { showToast('更新失败: ' + (xhr.responseJSON?.error || ''), 'error'); }
            });
        }
        function updateBudget() {
            var monthly = $('#monthly-budget').val();
            $.ajax({ url: '/api/settings/finance/budget', method: 'POST', contentType: 'application/json', data: JSON.stringify({ monthly: parseFloat(monthly) }),
                success: function() { showToast('预算已更新', 'success'); },
                error: function(xhr) { showToast('更新失败', 'error'); }
            });
        }
        function testModel() {
            var model = $('#test-model').val();
            $('#test-result').html('<span style="color:var(--text-secondary)">测试中...</span>');
            $.ajax({ url: '/api/settings/test_model', method: 'POST', contentType: 'application/json', data: JSON.stringify({ model: model }),
                success: function(data) {
                    if (data.success) { $('#test-result').html('<span style="color:var(--success)">✅ 连接成功</span><p style="margin-top:4px;">' + data.response + '</p>'); }
                    else { $('#test-result').html('<span style="color:var(--danger)">❌ 连接失败</span><p>' + data.error + '</p>'); }
                },
                error: function(xhr) { $('#test-result').html('<span style="color:var(--danger)">❌ 请求失败</span>'); }
            });
        }
    </script>
</body>
</html>
