<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统监控 - OPC-Agents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; background: #f5f6fa; color: #333; }

        .top-nav {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .top-nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-nav-left .logo {
            font-size: 18px;
            font-weight: 700;
            color: #1a73e8;
            cursor: pointer;
        }

        .top-nav-left .breadcrumb {
            font-size: 13px;
            color: #999;
        }

        .top-nav-left .breadcrumb a {
            color: #666;
            text-decoration: none;
        }

        .top-nav-left .breadcrumb a:hover { color: #1a73e8; }

        .top-nav-right { display: flex; gap: 16px; }

        .top-nav-item {
            font-size: 13px;
            color: #666;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .top-nav-item:hover { background: #f0f0f0; color: #333; }
        .top-nav-item.active { background: #E3F2FD; color: #1565C0; }

        .main-content {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title .icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-2px); }

        .stat-card .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-card .sub {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .stat-card.blue .value { color: #1a73e8; }
        .stat-card.purple .value { color: #667eea; }
        .stat-card.cyan .value { color: #00bcd4; }
        .stat-card.green .value { color: #4CAF50; }

        .progress-bar-wrap {
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .progress-bar-fill.blue { background: #1a73e8; }
        .progress-bar-fill.purple { background: #667eea; }
        .progress-bar-fill.cyan { background: #00bcd4; }
        .progress-bar-fill.green { background: #4CAF50; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .health-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .health-badge.healthy { background: #E8F5E9; color: #2E7D32; }
        .health-badge.degraded { background: #FFF3E0; color: #E65100; }
        .health-badge.unhealthy { background: #FFEBEE; color: #C62828; }

        .component-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
        }

        .component-item:last-child { border-bottom: none; }

        .component-name {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.healthy { background: #4CAF50; }
        .status-dot.degraded { background: #FF9800; }
        .status-dot.unhealthy { background: #f44336; }

        .alert-item {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            border-left: 3px solid;
        }

        .alert-item.critical { background: #FFEBEE; border-color: #f44336; color: #C62828; }
        .alert-item.warning { background: #FFF3E0; border-color: #FF9800; color: #E65100; }
        .alert-item.info { background: #E3F2FD; border-color: #1a73e8; color: #1565C0; }

        .alert-item .time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .task-stat-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            text-align: center;
        }

        .task-stat-item .num {
            font-size: 24px;
            font-weight: 700;
        }

        .task-stat-item .lbl {
            font-size: 12px;
            color: #999;
        }

        .queue-stat-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: center;
        }

        .queue-stat-item .num {
            font-size: 24px;
            font-weight: 700;
        }

        .queue-stat-item .lbl {
            font-size: 12px;
            color: #999;
        }

        .refresh-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 12px;
            color: #999;
        }

        .refresh-btn {
            padding: 6px 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .refresh-btn:hover { background: #1565C0; }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="top-nav-left">
            <div class="logo" onclick="window.location.href='/'">OPC-Agents</div>
            <div class="breadcrumb">
                <a href="/">首页</a> / <span>系统监控</span>
            </div>
        </div>
        <div class="top-nav-right">
            <div class="top-nav-item" onclick="window.location.href='/'">总裁办</div>
            <div class="top-nav-item" onclick="window.location.href='/finance'">财务部</div>
            <div class="top-nav-item" onclick="window.location.href='/agent_management'">代理管理</div>
            <div class="top-nav-item active">系统监控</div>
        </div>
    </div>

    <div class="main-content">
        <div class="page-title">
            <div class="icon">📊</div>
            系统监控仪表盘
            <span id="overall-badge" class="health-badge healthy" style="margin-left:auto;font-size:12px;">健康</span>
        </div>

        <div class="stats-row">
            <div class="stat-card blue">
                <div class="label">CPU 使用率</div>
                <div class="value" id="cpu-value">--%</div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill blue" id="cpu-bar" style="width:0%"></div>
                </div>
            </div>
            <div class="stat-card purple">
                <div class="label">内存使用率</div>
                <div class="value" id="memory-value">--%</div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill purple" id="memory-bar" style="width:0%"></div>
                </div>
            </div>
            <div class="stat-card cyan">
                <div class="label">磁盘使用率</div>
                <div class="value" id="disk-value">--%</div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill cyan" id="disk-bar" style="width:0%"></div>
                </div>
            </div>
            <div class="stat-card green">
                <div class="label">活跃任务</div>
                <div class="value" id="tasks-value">--</div>
                <div class="sub"><span id="pending-count">0</span> 等待 · <span id="completed-count">0</span> 完成</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-title">组件状态</div>
                <div id="components-list">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">活跃告警 <span id="alert-count" style="background:#f44336;color:white;padding:2px 8px;border-radius:10px;font-size:11px;">0</span></div>
                <div id="alerts-list">
                    <div class="empty-state">暂无告警</div>
                </div>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-title">任务执行统计</div>
                <div class="task-stat-row">
                    <div class="task-stat-item">
                        <div class="num" id="stat-queued" style="color:#1a73e8;">0</div>
                        <div class="lbl">排队中</div>
                    </div>
                    <div class="task-stat-item">
                        <div class="num" id="stat-running" style="color:#FF9800;">0</div>
                        <div class="lbl">执行中</div>
                    </div>
                    <div class="task-stat-item">
                        <div class="num" id="stat-completed" style="color:#4CAF50;">0</div>
                        <div class="lbl">已完成</div>
                    </div>
                    <div class="task-stat-item">
                        <div class="num" id="stat-failed" style="color:#f44336;">0</div>
                        <div class="lbl">已失败</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">消息队列状态</div>
                <div class="queue-stat-row">
                    <div class="queue-stat-item">
                        <div class="num" id="queue-size">0</div>
                        <div class="lbl">队列大小</div>
                    </div>
                    <div class="queue-stat-item">
                        <div class="num" id="queue-processed">0</div>
                        <div class="lbl">已处理</div>
                    </div>
                    <div class="queue-stat-item">
                        <div class="num" id="queue-failed">0</div>
                        <div class="lbl">处理失败</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="refresh-bar">
            <span>最后更新: <span id="last-update">--</span></span>
            <button class="refresh-btn" onclick="refreshData()">刷新数据</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function safeFetch(url) {
            return fetch(url).then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            }).catch(e => {
                console.warn('Fetch failed:', url, e.message);
                return null;
            });
        }

        function refreshData() {
            Promise.all([
                safeFetch('/api/health/'),
                safeFetch('/api/health/metrics'),
                safeFetch('/api/health/alerts'),
                safeFetch('/api/health/tasks'),
                safeFetch('/api/health/queue')
            ]).then(([health, metrics, alerts, tasks, queue]) => {
                if (health) updateHealth(health);
                if (metrics) updateMetrics(metrics);
                if (alerts) updateAlerts(alerts);
                if (tasks) updateTasks(tasks);
                if (queue) updateQueue(queue);
                document.getElementById('last-update').textContent = new Date().toLocaleString();
            });
        }

        function updateHealth(data) {
            var status = data.overall_status || 'healthy';
            var badge = document.getElementById('overall-badge');
            badge.className = 'health-badge ' + status;
            var labels = { healthy: '✅ 健康', degraded: '⚠️ 降级', unhealthy: '❌ 异常' };
            badge.textContent = labels[status] || status;

            var components = document.getElementById('components-list');
            var checks = data.checks || {};
            var keys = Object.keys(checks);
            if (keys.length === 0) {
                components.innerHTML = '<div class="empty-state">暂无组件数据</div>';
                return;
            }
            var nameMap = {
                database: '数据库', task_executor: '任务执行器',
                communication_manager: '通信管理器', llm_service: 'LLM服务',
                message_queue: '消息队列', file_system: '文件系统'
            };
            var html = '';
            keys.forEach(function(name) {
                var check = checks[name];
                var s = check.status || 'healthy';
                var label = nameMap[name] || name;
                html += '<div class="component-item">';
                html += '<span class="component-name"><span class="status-dot ' + s + '"></span>' + label + '</span>';
                html += '<span style="font-size:12px;color:#999;">' + s + '</span>';
                html += '</div>';
            });
            components.innerHTML = html;
        }

        function updateMetrics(data) {
            var m = data.metrics || {};
            var cpu = (m.system_cpu_usage && m.system_cpu_usage.last) || 0;
            var mem = (m.system_memory_usage && m.system_memory_usage.last) || 0;
            var disk = (m.system_disk_usage && m.system_disk_usage.last) || 0;
            var active = (m.tasks_active && m.tasks_active.last) || 0;
            var pending = (m.tasks_pending && m.tasks_pending.last) || 0;
            var completed = (m.tasks_completed && m.tasks_completed.last) || 0;

            document.getElementById('cpu-value').textContent = cpu.toFixed(1) + '%';
            document.getElementById('cpu-bar').style.width = Math.min(cpu, 100) + '%';
            document.getElementById('memory-value').textContent = mem.toFixed(1) + '%';
            document.getElementById('memory-bar').style.width = Math.min(mem, 100) + '%';
            document.getElementById('disk-value').textContent = disk.toFixed(1) + '%';
            document.getElementById('disk-bar').style.width = Math.min(disk, 100) + '%';
            document.getElementById('tasks-value').textContent = active;
            document.getElementById('pending-count').textContent = pending;
            document.getElementById('completed-count').textContent = completed;
        }

        function updateAlerts(data) {
            var list = document.getElementById('alerts-list');
            var count = document.getElementById('alert-count');
            var alerts = data.alerts || [];
            count.textContent = alerts.length;
            if (alerts.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无告警</div>';
                return;
            }
            var html = '';
            alerts.forEach(function(a) {
                var level = a.level || 'info';
                var ts = a.timestamp ? new Date(a.timestamp * 1000).toLocaleString() : '';
                html += '<div class="alert-item ' + level + '">';
                html += '<div>' + (a.message || '') + '</div>';
                if (ts) html += '<div class="time">' + ts + (a.source ? ' · ' + a.source : '') + '</div>';
                html += '</div>';
            });
            list.innerHTML = html;
        }

        function updateTasks(data) {
            var s = data.statistics || {};
            document.getElementById('stat-queued').textContent = s.queue_size || 0;
            document.getElementById('stat-running').textContent = s.active_workers || 0;
            document.getElementById('stat-completed').textContent = s.completed_tasks || 0;
            document.getElementById('stat-failed').textContent = s.failed_tasks || 0;
        }

        function updateQueue(data) {
            var s = data.statistics || {};
            document.getElementById('queue-size').textContent = s.queue_size || 0;
            document.getElementById('queue-processed').textContent = s.total_processed || 0;
            document.getElementById('queue-failed').textContent = s.total_failed || 0;
        }

        $(document).ready(function() {
            refreshData();
            setInterval(refreshData, 30000);
        });
    </script>
</body>
</html>
