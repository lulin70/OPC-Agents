<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信绑定 - OPC-Agents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .pairing-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .qr-code-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 3px solid #07c160;
        }
        
        .qr-code {
            width: 280px;
            height: 280px;
            margin: 0 auto;
            display: block;
            border-radius: 10px;
        }
        
        .pairing-code-section {
            margin: 25px 0;
        }
        
        .pairing-code-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .pairing-code {
            font-size: 36px;
            font-weight: bold;
            color: #07c160;
            letter-spacing: 6px;
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 15px 30px;
            border-radius: 10px;
            display: inline-block;
            user-select: all;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .pairing-code:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        
        .pairing-code:active {
            transform: scale(0.98);
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 16px;
            font-weight: 500;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.approved {
            background: #d4edda;
            color: #155724;
        }
        
        .status.expired {
            background: #f8d7da;
            color: #721c24;
        }
        
        .timer {
            font-size: 18px;
            color: #ff6b6b;
            margin: 20px 0;
            font-weight: 600;
        }
        
        .timer.danger {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        
        .instructions {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-top: 25px;
            text-align: left;
        }
        
        .instructions h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .instructions ol {
            margin: 15px 0;
            padding-left: 25px;
        }
        
        .instructions li {
            margin: 12px 0;
            line-height: 1.8;
            color: #555;
            font-size: 15px;
        }
        
        .instructions .highlight {
            color: #07c160;
            font-weight: 600;
        }
        
        .tips {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .tips p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0;
        }
        
        .refresh-btn {
            background: #07c160;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(7, 193, 96, 0.3);
        }
        
        .refresh-btn:hover {
            background: #06ad56;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(7, 193, 96, 0.4);
        }
        
        .refresh-btn:active {
            transform: translateY(0);
        }
        
        .refresh-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .copy-hint {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
        
        .icon {
            display: inline-block;
            margin-right: 8px;
        }
        
        /* 响应式设计 */
        @media (max-width: 600px) {
            .pairing-container {
                padding: 25px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .qr-code {
                width: 220px;
                height: 220px;
            }
            
            .pairing-code {
                font-size: 28px;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="pairing-container">
        <h1>🔗 微信绑定</h1>
        <p class="subtitle">扫描二维码或使用配对码完成绑定</p>
        
        <div id="pairing-content">
            <!-- 二维码 -->
            <div class="qr-code-container">
                <img id="qr-code" class="qr-code" src="" alt="配对二维码">
            </div>
            
            <!-- 配对码 -->
            <div class="pairing-code-section">
                <div class="pairing-code-label">配对码（点击复制）</div>
                <div class="pairing-code" id="pairing-code" title="点击复制" onclick="copyPairingCode()">
                    加载中...
                </div>
                <div class="copy-hint">💡 点击配对码可快速复制</div>
            </div>
            
            <!-- 状态 -->
            <div class="status pending" id="status">
                <span class="icon">⏳</span> 等待微信扫码绑定...
            </div>
            
            <!-- 倒计时 -->
            <div class="timer" id="timer">
                剩余时间：<span id="remaining">60:00</span>
            </div>
            
            <!-- 刷新按钮 -->
            <button class="refresh-btn" id="refresh-btn" onclick="refreshPairing()">
                🔄 刷新二维码
            </button>
        </div>
        
        <!-- 绑定说明 -->
        <div class="instructions">
            <h3>📱 绑定步骤：</h3>
            <ol>
                <li>打开微信，使用<span class="highlight">"扫一扫"</span>功能</li>
                <li>扫描上方的<span class="highlight">二维码</span></li>
                <li>点击<span class="highlight">"确认绑定"</span></li>
                <li>绑定成功后，即可在微信中与 OPC-Agents 对话</li>
            </ol>
            
            <div class="tips">
                <p><strong>💡 提示：</strong></p>
                <p>• 二维码有效期为 <strong>1 小时</strong>，过期后需刷新</p>
                <p>• 绑定成功后，此页面会自动跳转到对话页面</p>
                <p>• 如有问题，请点击"刷新二维码"重新生成</p>
                <p>• 配对码也可以用于命令行绑定：<code>openclaw pairing approve &lt;CODE&gt;</code></p>
            </div>
        </div>
    </div>
    
    <script>
        let pairingCode = '';
        let countdownInterval;
        let statusCheckInterval;
        
        // 页面加载时创建配对请求
        async function createPairing() {
            try {
                // 禁用刷新按钮
                const refreshBtn = document.getElementById('refresh-btn');
                refreshBtn.disabled = true;
                refreshBtn.textContent = '生成中...';
                
                const response = await fetch('/api/wechat/pairing/create', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    pairingCode = data.result.pairing_code;
                    
                    // 更新 UI
                    document.getElementById('pairing-code').textContent = pairingCode;
                    document.getElementById('qr-code').src = data.result.qr_code;
                    
                    // 启动倒计时
                    startCountdown(data.result.expires_in);
                    
                    // 轮询检查绑定状态
                    checkPairingStatus();
                    
                    // 启用刷新按钮
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '🔄 刷新二维码';
                    
                } else {
                    alert('创建配对失败：' + data.error.message);
                    refreshBtn.disabled = false;
                }
            } catch (error) {
                console.error('Failed to create pairing:', error);
                alert('创建配对失败，请刷新页面重试');
            }
        }
        
        // 启动倒计时
        function startCountdown(seconds) {
            let remaining = seconds;
            
            // 清除之前的倒计时
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            countdownInterval = setInterval(() => {
                remaining--;
                
                const minutes = Math.floor(remaining / 60);
                const secs = remaining % 60;
                
                document.getElementById('remaining').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                // 最后 5 分钟显示警告
                if (remaining < 300) {
                    document.getElementById('timer').classList.add('danger');
                }
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('status').className = 'status expired';
                    document.getElementById('status').innerHTML = '<span class="icon">❌</span> 二维码已过期，请刷新';
                    
                    // 禁用刷新按钮
                    document.getElementById('refresh-btn').disabled = false;
                }
            }, 1000);
        }
        
        // 检查绑定状态
        async function checkPairingStatus() {
            const checkStatus = async () => {
                try {
                    const response = await fetch(`/api/wechat/pairing/status?code=${pairingCode}`);
                    const data = await response.json();
                    
                    if (data.status === 'approved') {
                        // 绑定成功
                        clearInterval(countdownInterval);
                        clearInterval(statusCheckInterval);
                        
                        document.getElementById('status').className = 'status approved';
                        document.getElementById('status').innerHTML = '<span class="icon">✅</span> 绑定成功！正在跳转...';
                        
                        // 3 秒后跳转到对话页面
                        setTimeout(() => {
                            window.location.href = '/chat';
                        }, 3000);
                    } else if (data.status === 'expired') {
                        // 已过期
                        document.getElementById('status').className = 'status expired';
                        document.getElementById('status').innerHTML = '<span class="icon">❌</span> 二维码已过期，请刷新';
                        document.getElementById('refresh-btn').disabled = false;
                    } else {
                        // 继续轮询
                        statusCheckInterval = setTimeout(checkStatus, 3000);
                    }
                } catch (error) {
                    console.error('Failed to check status:', error);
                    statusCheckInterval = setTimeout(checkStatus, 3000);
                }
            };
            
            checkStatus();
        }
        
        // 刷新配对
        async function refreshPairing() {
            // 清除定时器
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            if (statusCheckInterval) {
                clearTimeout(statusCheckInterval);
            }
            
            // 重置 UI
            document.getElementById('pairing-code').textContent = '加载中...';
            document.getElementById('status').className = 'status pending';
            document.getElementById('status').innerHTML = '<span class="icon">⏳</span> 生成新二维码...';
            document.getElementById('timer').classList.remove('danger');
            
            await createPairing();
        }
        
        // 复制配对码
        function copyPairingCode() {
            if (!pairingCode || pairingCode === '加载中...') {
                return;
            }
            
            navigator.clipboard.writeText(pairingCode).then(() => {
                // 显示复制成功提示
                const originalText = document.getElementById('pairing-code').textContent;
                document.getElementById('pairing-code').textContent = '✅ 已复制!';
                document.getElementById('pairing-code').style.background = '#d4edda';
                
                setTimeout(() => {
                    document.getElementById('pairing-code').textContent = originalText;
                    document.getElementById('pairing-code').style.background = '#f0f0f0';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('复制失败，请手动复制');
            });
        }
        
        // 页面加载时初始化
        createPairing();
        
        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            if (statusCheckInterval) {
                clearTimeout(statusCheckInterval);
            }
        });
    </script>
</body>
</html>
