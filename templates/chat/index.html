<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话中心 - OPC-Agents</title>
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="stylesheet" href="/static/css/notifications.css">
</head>
<body>
  <div class="chat-container">
    <!-- Sidebar -->
    <div class="chat-sidebar">
      <div class="sidebar-header">
        <h2>💬 对话历史</h2>
        <button class="new-chat-btn" onclick="createNewConversation()">
          + 新建对话
        </button>
      </div>
      
      <div class="conversation-list" id="conversationList">
        <!-- Conversations loaded dynamically -->
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
          加载中...
        </div>
      </div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="chat-main">
      <div class="chat-header">
        <h1 id="chatTitle">选择或创建一个对话</h1>
      </div>
      
      <div class="chat-messages" id="chatMessages">
        <div style="text-align: center; padding: 60px; color: var(--text-muted);">
          <div style="font-size: 48px; margin-bottom: 20px;">💬</div>
          <div>选择一个对话开始聊天，或点击"新建对话"</div>
        </div>
      </div>
      
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <textarea 
            class="chat-input" 
            id="messageInput"
            placeholder="输入消息..."
            rows="1"
            onkeypress="handleKeyPress(event)"
          ></textarea>
          <button class="send-btn" onclick="sendMessage()" id="sendBtn">
            发送
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    let currentConversationId = null;
    let conversations = [];
    
    // Load conversations on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadConversations();
    });
    
    async function loadConversations() {
      try {
        const response = await fetch('/api/v2/chat?user_id=default_user&page=1&limit=20');
        const data = await response.json();
        
        if (data.success) {
          conversations = data.data.items;
          renderConversationList();
        }
      } catch (error) {
        console.error('Failed to load conversations:', error);
        document.getElementById('conversationList').innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            加载对话失败
          </div>
        `;
      }
    }
    
    function renderConversationList() {
      const list = document.getElementById('conversationList');
      
      if (conversations.length === 0) {
        list.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            暂无对话
          </div>
        `;
        return;
      }
      
      list.innerHTML = conversations.map(conv => `
        <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}"
             onclick="selectConversation('${conv.id}')">
          <div class="conversation-title">${escapeHtml(conv.title)}</div>
          <div class="conversation-meta">
            ${conv.message_count || 0} 条消息 · ${formatTime(conv.last_message_at)}
          </div>
        </div>
      `).join('');
    }
    
    async function selectConversation(id) {
      currentConversationId = id;
      
      try {
        const response = await fetch(`/api/v2/chat/${id}?limit=50`);
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('chatTitle').textContent = data.data.title;
          renderMessages(data.data.messages || []);
          renderConversationList(); // Update active state
        }
      } catch (error) {
        console.error('Failed to load conversation:', error);
        alert('加载对话失败');
      }
    }
    
    function renderMessages(messages) {
      const container = document.getElementById('chatMessages');
      
      if (messages.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 60px; color: var(--text-muted);">
            <div style="font-size: 48px; margin-bottom: 20px;">💬</div>
            <div>开始对话吧！</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = messages.map(msg => `
        <div class="message ${msg.role}">
          <div class="message-avatar">
            ${getAvatar(msg.role)}
          </div>
          <div>
            <div class="message-content">
              <div class="message-text">${escapeHtml(msg.content)}</div>
              <div class="message-time">${formatTime(msg.created_at)}</div>
            </div>
          </div>
        </div>
      `).join('');
      
      // Scroll to bottom
      container.scrollTop = container.scrollHeight;
    }
    
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      
      if (!content || !currentConversationId) {
        return;
      }
      
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      
      try {
        // Add user message
        await fetch(`/api/v2/chat/${currentConversationId}/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            role: 'user',
            type: 'text',
            content: content
          })
        });
        
        input.value = '';
        
        // Reload messages
        await selectConversation(currentConversationId);
        
        // TODO: Send to executive office and get response
      } catch (error) {
        console.error('Failed to send message:', error);
        alert('发送失败，请重试');
      } finally {
        sendBtn.disabled = false;
      }
    }
    
    async function createNewConversation() {
      try {
        const response = await fetch('/api/v2/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: 'default_user',
            title: '新对话',
            initial_message: '你好！'
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          await loadConversations();
          selectConversation(data.data.id);
        }
      } catch (error) {
        console.error('Failed to create conversation:', error);
        alert('创建对话失败');
      }
    }
    
    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }
    
    function getAvatar(role) {
      const avatars = {
        'user': '👤',
        'executive': '🎩',
        'system': '⚙️',
        'task': '📋'
      };
      return avatars[role] || '💬';
    }
    
    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);
      
      if (days > 0) return `${days}天前`;
      if (hours > 0) return `${hours}小时前`;
      if (minutes > 0) return `${minutes}分钟前`;
      return '刚刚';
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
